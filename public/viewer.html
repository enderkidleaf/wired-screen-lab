<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平板接收端</title><link rel="stylesheet" href="/style.css"></head><body data-role="viewer"><main><header><span class="eyebrow">WIRED SCREEN LAB · RECEIVER</span><h1>你的桌面，在这里。</h1><p>连接后可全屏显示。此版本支持观看，不支持触控回传。</p></header><section class="card"><div class="sectionhead"><span id="status" class="badge">等待连接</span><div class="buttons"><label>配对码<input id="paircode" inputmode="numeric" maxlength="8" placeholder="电脑显示的 8 位数字" autocomplete="off"></label><button id="connect">连接电脑</button><button id="fullscreen" class="secondary">全屏</button><button id="export" class="secondary" disabled>导出测量记录</button></div></div><video id="video" autoplay muted playsinline></video><div id="metrics" class="metrics"></div><p id="quality">接收帧率将在画面连接后显示。</p><p id="route" class="note"></p><pre id="log" aria-live="polite"></pre></section></main><script src="/app.js"></script></body></html>
